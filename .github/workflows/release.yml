# Publishes a new launcher version on the Releases page: ATM-Setup.exe (Windows) and ATM-Launcher.AppImage (Linux).
# Installed launchers find it at startup, download it and update themselves.
#
# How to trigger it: push to main with a commit message like
#   [off_update] [1.2.0] Nouveau fond d'écran      -> official release, every launcher updates
#   [off_update] [2.0.0] [name: Nouveau Nom] ...    -> same, and the release name changes (kept for the next ones)
#   [dev_update] [1.2.0] Test des nouvelles configs -> dev pre-release (v1.2.0-dev), launchers ignore it
# The admin website's "Fusionner" button creates exactly these merge commits.
# Or run it by hand: Actions tab > "Release launcher" > Run workflow.
#
# Steps: "version" reads the version once, "windows" and "linux" build at the same time, "publish" creates the
# release with every file (so a release never exists with only one of the two).
name: Release launcher

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: Version (ex. 1.2.0)
        required: true
      name:
        description: Nouveau nom de version (vide = garder le nom actuel)
        required: false
      channel:
        description: Type de version
        type: choice
        options: [official, dev]
        default: official

permissions:
  contents: write

concurrency: release

jobs:
  version:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(toJSON(github.event.commits.*.message), '[off_update]') ||
      contains(toJSON(github.event.commits.*.message), '[dev_update]')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      name: ${{ steps.version.outputs.name }}
      title: ${{ steps.version.outputs.title }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Read the version from "[off_update] [x.y.z]" or "[dev_update] [x.y.z]"
        id: version
        env:
          COMMITS_JSON: ${{ toJSON(github.event.commits) }}
          MANUAL_VERSION: ${{ inputs.version }}
          MANUAL_CHANNEL: ${{ inputs.channel }}
          MANUAL_NAME: ${{ inputs.name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          export LATEST_TAG="$(gh release view --json tagName --jq .tagName 2> /dev/null || true)"
          export LATEST_NAME="$(gh release view --json name --jq .name 2> /dev/null || true)"
          node tools/release-version.js

      - uses: actions/upload-artifact@v4
        with:
          name: notes
          path: ${{ runner.temp }}/release-notes.md

  windows:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Configure the launcher
        run: node tools/ci-config.js
        env:
          SERVER_URL: ${{ vars.SERVER_URL }}
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
          RELEASE_NAME: ${{ needs.version.outputs.name }}

      - name: Build installer
        run: npx electron-builder --win --x64 --publish never

      - name: Files for file-by-file updates (installed launchers only download what changed)
        run: node tools/build-app-update.js

      - name: Checksum (launchers verify the download with it)
        shell: bash
        run: |
          node -e "const c=require('crypto'),f=require('fs');f.writeFileSync('dist/ATM-Setup.exe.sha256',c.createHash('sha256').update(f.readFileSync('dist/ATM-Setup.exe')).digest('hex')+'  ATM-Setup.exe\n')"

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/ATM-Setup.exe
            dist/ATM-Setup.exe.sha256
            dist/app-update/*

  linux:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Configure the launcher
        run: node tools/ci-config.js
        env:
          SERVER_URL: ${{ vars.SERVER_URL }}
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
          RELEASE_NAME: ${{ needs.version.outputs.name }}

      - name: Build AppImage
        run: npx electron-builder --linux AppImage --x64 --publish never

      - name: Checksum
        run: (cd dist && sha256sum ATM-Launcher.AppImage > ATM-Launcher.AppImage.sha256)

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist/ATM-Launcher.AppImage
            dist/ATM-Launcher.AppImage.sha256

  publish:
    needs: [version, windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: out

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
          TITLE: ${{ needs.version.outputs.title }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          # Dev versions are pre-releases: launchers only install the latest official release.
          EXTRA=()
          if [ "$PRERELEASE" = "true" ]; then EXTRA=(--prerelease --latest=false); fi
          gh release create "$TAG" out/windows/ATM-Setup.exe out/windows/ATM-Setup.exe.sha256 out/windows/app-update/* \
            out/linux/ATM-Launcher.AppImage out/linux/ATM-Launcher.AppImage.sha256 \
            --target "$GITHUB_SHA" \
            --title "$TITLE" \
            --notes-file out/notes/release-notes.md \
            "${EXTRA[@]}"
