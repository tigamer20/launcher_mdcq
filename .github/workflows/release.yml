# Publishes a new launcher version (ModdedQC-Setup.exe) on the Releases page.
# Installed launchers find it at startup, download it and update themselves.
#
# How to trigger it: push to main with a commit message like
#   [off_update] [1.2.0] Nouveau fond d'écran et correction du bouton JOUER
# or run it by hand: Actions tab > "Release launcher" > Run workflow > type the version.
name: Release launcher

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: Version (ex. 1.2.0)
        required: true

permissions:
  contents: write

concurrency: release

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || contains(toJSON(github.event.commits.*.message), '[off_update]')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Read the version from "[off_update] [x.y.z]"
        id: version
        shell: bash
        env:
          COMMITS_JSON: ${{ toJSON(github.event.commits) }}
          MANUAL_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          export LATEST_TAG="$(gh release view --json tagName --jq .tagName 2> /dev/null || true)"
          node tools/release-version.js

      - run: npm ci

      - name: Configure the launcher
        run: node tools/ci-config.js
        env:
          SERVER_URL: ${{ vars.SERVER_URL }}
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}

      - name: Build installer
        run: npx electron-builder --win --x64 --publish never

      - name: Checksum (launchers verify the download with it)
        shell: bash
        run: |
          node -e "const c=require('crypto'),f=require('fs');f.writeFileSync('dist/ModdedQC-Setup.exe.sha256',c.createHash('sha256').update(f.readFileSync('dist/ModdedQC-Setup.exe')).digest('hex')+'  ModdedQC-Setup.exe\n')"

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v$VERSION" dist/ModdedQC-Setup.exe dist/ModdedQC-Setup.exe.sha256 \
            --target "$GITHUB_SHA" \
            --title "ModdedQC Launcher $VERSION" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
